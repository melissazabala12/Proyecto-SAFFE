version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_saffe
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_usuarios
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_saffe
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: always

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: saffe_backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=sistema_usuarios
      - DB_PORT=3306
      - JWT_SECRET=mi_clave_super_secreta
      - FRONTEND_ORIGIN=http://localhost:4000
    depends_on:
      - db

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: saffe_frontend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

volumes:
  db_data: