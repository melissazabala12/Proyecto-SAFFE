version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: saffe_backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: saffe_frontend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
    depends_on:
      - backend